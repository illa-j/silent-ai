name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          # macOS 15 images are arm64 by default; macos-15-intel is the Intel
          # runner. The binary still targets macOS 13 via MACOSX_DEPLOYMENT_TARGET.
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - name: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
          - name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches workspace version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          app_version="$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' app/tauri.conf.json | head -n1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match workspace version v$version" >&2
            echo "Bump Cargo.toml, app/tauri.conf.json, and CHANGELOG.md together." >&2
            exit 1
          fi
          if [ "$app_version" != "$version" ]; then
            echo "app/tauri.conf.json version ($app_version) does not match workspace version ($version)" >&2
            exit 1
          fi

      - name: Linux dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libasound2-dev \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libgtk-3-dev \
            librsvg2-dev patchelf libayatana-appindicator3-dev libxdo-dev

      - name: macOS build tools
        if: startsWith(matrix.os, 'macos')
        run: brew install cmake

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build and publish bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOSX_DEPLOYMENT_TARGET: "13.0"
          CMAKE_OSX_DEPLOYMENT_TARGET: "13.0"
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "Silent AI ${{ github.ref_name }}"
          releaseBody: |
            Silent AI ${{ github.ref_name }} — low-latency meeting copilot.

            Downloads:
            - Windows 10 2004+/11: `.msi` and NSIS `.exe`
            - macOS 13+: `.dmg` for Intel and Apple Silicon
            - Linux x86_64: `.AppImage` and `.deb`

            These are CPU-only builds with local Whisper. CUDA, Metal, CoreML,
            Vulkan, and Deepgram builds are documented in the README (build from
            source). The first launch downloads a Whisper model.

            You need an OpenAI-compatible LLM endpoint. Put the API key in
            `~/.config/silent-ai/api_key` (Linux),
            `~/Library/Application Support/silent-ai/api_key` (macOS), or
            `%APPDATA%\silent-ai\api_key` (Windows), or set the environment
            variable named by `llm.api_key_env` (`OPENCODE_API_KEY` by default).

            Binaries are unsigned. On KDE Plasma 6.6+, install the bundled
            `scripts/install-kde-stealth.sh` from the source tree to exclude the
            window from ScreenCast. See SECURITY.md and the README for privacy,
            limitations, and troubleshooting.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: silent-ai-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/bundle/**
            target/release/bundle/**
          if-no-files-found: error
