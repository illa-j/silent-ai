name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  linux:
    name: test + clippy + tauri check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libasound2-dev \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libgtk-3-dev \
            librsvg2-dev patchelf libayatana-appindicator3-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Unit tests
        run: cargo test -p silent-ai-core --lib

      - name: Mock LLM integration test
        run: cargo test -p silent-ai-core --features test-support --test llm_no_question

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tauri app check
        run: cargo check -p silent-ai-app

      - name: Deepgram backend check
        run: cargo check -p silent-ai-core --features deepgram

  cross-platform-check:
    name: check ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: macOS tools
        if: startsWith(matrix.os, 'macos')
        run: brew install cmake

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check app (native audio + window stealth code)
        run: cargo check -p silent-ai-app
