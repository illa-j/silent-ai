name: Feature request
description: Suggest a capability, platform improvement, or documentation change.
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what is missing or awkward today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like. Include alternatives you considered.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Audio capture
        - STT / transcription
        - LLM / answers
        - Chat UI
        - Notes
        - Screen-share exclusion
        - Packaging / installation
        - Documentation
        - Other
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - All platforms
        - Linux
        - Windows
        - macOS
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, examples, links, or constraints.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and pull requests.
          required: true
